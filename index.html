<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actix Web REST API Frontend</title>
  <meta name="description" content="TypeScript/Bun/React frontend for Actix Web REST API with JWT authentication and multi-tenant support">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#007bff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Actix Frontend">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" type="image/png">
  <script>
    // Global process polyfill for production
    // Prevents "Cannot read properties of undefined (reading 'version')" errors
    if (typeof globalThis.process === 'undefined') {
      globalThis.process = {
        version: '1.0.0',
        versions: {},
        env: { NODE_ENV: 'production' },
        platform: 'browser',
        browser: true,
      };
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
